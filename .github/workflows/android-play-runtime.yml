name: Build CUMA WORLD Android Play Runtime

on:
  push:
    branches: [ chatgpt/android-play-runtime ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'ci/measure_android_web_bundle.py'
      - 'ci/install_high_character.py'
      - 'ci/validate_android_character_glb.py'
      - 'index.html'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android-play-runtime.yml'
      - 'CUMA_WORLD_3D_GitHub_APK_Autobuild_2.1.1.zip'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_ARCHIVE: CUMA_WORLD_3D_GitHub_APK_Autobuild_2.1.1.zip
  CUMA_VERSION_CODE: '1100'
  CUMA_VERSION_NAME: '11.0.0-pre.1'

jobs:
  android-play-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Package verified CUMA character asset
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p public/assets/characters
          CHARACTER_PATH="$(unzip -Z1 "$SOURCE_ARCHIVE" | grep -E '(^|/)assets/characters/cuma_high\.glb$' | head -n1 || true)"
          if [ -z "$CHARACTER_PATH" ]; then
            CHARACTER_PATH="$(unzip -Z1 "$SOURCE_ARCHIVE" | grep -E '(^|/)assets/characters/cuma\.glb$' | head -n1 || true)"
          fi

          if [ -n "$CHARACTER_PATH" ]; then
            unzip -p "$SOURCE_ARCHIVE" "$CHARACTER_PATH" > public/assets/characters/cuma_runtime.glb
            printf '%s\n' "archive:$CHARACTER_PATH" > /tmp/cuma_character_source.txt
            printf '%s\n' 'archive-provided; see repository asset provenance' > public/assets/characters/CUMA_HIGH_LICENSE.txt
          else
            success=0
            for attempt in 1 2 3; do
              echo "Verified high-character install attempt $attempt/3"
              if python3 ci/install_high_character.py; then
                success=1
                break
              fi
              sleep $((attempt * 3))
            done
            test "$success" -eq 1
            test -s game/assets/characters/cuma_high.glb
            test -s game/assets/characters/CUMA_HIGH_LICENSE.txt
            cp game/assets/characters/cuma_high.glb public/assets/characters/cuma_runtime.glb
            cp game/assets/characters/CUMA_HIGH_LICENSE.txt public/assets/characters/CUMA_HIGH_LICENSE.txt
            printf '%s\n' 'pinned-cc0:kunalkushwaha/vsim@3f97faf85e46d2f9a122b0a8b8d3ccc0af598f91/packages/assets/library/suited.glb' > /tmp/cuma_character_source.txt
          fi

          test -s public/assets/characters/cuma_runtime.glb
          test -s public/assets/characters/CUMA_HIGH_LICENSE.txt
          python3 ci/validate_android_character_glb.py public/assets/characters/cuma_runtime.glb
          sha256sum public/assets/characters/cuma_runtime.glb > /tmp/cuma_runtime.glb.sha256
          echo 'CUMA_MODEL_PACKAGED=true' >> "$GITHUB_ENV"

      - name: Detect optional game audio assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p public/assets/audio
          packaged=()
          for asset in city_ambience.wav footstep_a.wav footstep_b.wav; do
            ASSET_PATH="$(unzip -Z1 "$SOURCE_ARCHIVE" | grep -E "(^|/)assets/audio/${asset}$" | head -n1 || true)"
            if [ -n "$ASSET_PATH" ]; then
              unzip -p "$SOURCE_ARCHIVE" "$ASSET_PATH" > "public/assets/audio/$asset"
              test -s "public/assets/audio/$asset"
              packaged+=("$asset")
            fi
          done
          if [ "${#packaged[@]}" -gt 0 ]; then
            (IFS=,; echo "AUDIO_ASSETS=${packaged[*]}") >> "$GITHUB_ENV"
          else
            echo 'AUDIO_ASSETS=not_packaged' >> "$GITHUB_ENV"
          fi

      - name: Install web runtime dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build game runtime
        shell: bash
        run: |
          set -euxo pipefail
          VITE_BUILD_SHA="$GITHUB_SHA" VITE_CUMA_MODEL_PACKAGED="${CUMA_MODEL_PACKAGED:-false}" npm run build
          test -s dist/index.html
          test -s public/privacy.html
          test -s dist/privacy.html
          grep -q '"version": "11.0.0-pre.1"' package.json
          grep -q 'graphics-tier' index.html
          grep -q 'privacy.html' index.html
          grep -Fq 'await import("./game/runtime11")' src/main.ts
          ! grep -Eq '^import[[:space:]].*runtime11' src/main.ts
          grep -q 'hud.css' src/main.ts
          grep -q 'useOpportunity' src/game/mission.ts
          grep -q 'camera_bypass' src/game/mission.ts
          grep -q 'canInteract' src/game/mission.ts
          grep -q 'InteractionPromptGuard' src/main.ts
          grep -q 'investigateTimer' src/game/npc.ts
          grep -q 'senseInterval' src/game/npc.ts
          grep -q 'private enabled = true' src/game/npc.ts
          grep -q 'wasMuted' src/game/audio.ts
          grep -q 'UiAudioFeedback' src/main.ts
          grep -q 'ui-audio-feedback' src/main.ts
          grep -q 'freezeWorldMatrix' src/game/visuals.ts
          grep -q 'VITE_CUMA_MODEL_PACKAGED' src/game/character.ts
          grep -q 'resolveAnimationGroups' src/game/character.ts
          grep -q 'CharacterAnimationState' src/game/character-animation.ts
          grep -q 'setWeightForAllAnimatables' src/game/character-blender.ts
          grep -q 'codeSplitting' vite.config.ts
          grep -q 'babylon-runtime' vite.config.ts
          grep -q 'sensorLandscape' .github/workflows/android-play-runtime.yml
          test -s dist/assets/characters/cuma_runtime.glb
          test -s dist/assets/characters/CUMA_HIGH_LICENSE.txt
          if [ "${AUDIO_ASSETS:-not_packaged}" != 'not_packaged' ]; then
            test -d dist/assets/audio
          fi
          python3 ci/measure_android_web_bundle.py
          node ci/test_character_runtime.mjs

      - name: Create native Android project
        shell: bash
        run: |
          set -euxo pipefail
          npx cap add android
          npx cap sync android
          grep -F 'targetSdkVersion = 36' android/variables.gradle
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          if 'android:screenOrientation=' in text:
              text = re.sub(r'android:screenOrientation="[^"]+"', 'android:screenOrientation="sensorLandscape"', text, count=1)
          else:
              anchor = 'android:exported="true"'
              if anchor not in text:
                  raise SystemExit('Android activity export anchor not found')
              text = text.replace(anchor, anchor + '\n            android:screenOrientation="sensorLandscape"', 1)
          if 'android:usesCleartextTraffic=' in text:
              text = re.sub(r'android:usesCleartextTraffic="[^"]+"', 'android:usesCleartextTraffic="false"', text, count=1)
          else:
              text = text.replace('<application', '<application android:usesCleartextTraffic="false"', 1)
          manifest.write_text(text, encoding='utf-8')

          gradle = Path('android/app/build.gradle')
          gradle_text = gradle.read_text(encoding='utf-8')
          version_code = os.environ['CUMA_VERSION_CODE']
          version_name = os.environ['CUMA_VERSION_NAME']
          gradle_text, code_count = re.subn(r'(?m)^(\s*)versionCode\s+\d+\s*$', rf'\1versionCode {version_code}', gradle_text, count=1)
          gradle_text, name_count = re.subn(r'(?m)^(\s*)versionName\s+"[^"]+"\s*$', rf'\1versionName "{version_name}"', gradle_text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Android versionCode/versionName anchors not found')
          gradle.write_text(gradle_text, encoding='utf-8')

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          props = wrapper.read_text(encoding='utf-8')
          if 'networkTimeout=' in props:
              props = re.sub(r'networkTimeout=\d+', 'networkTimeout=120000', props)
          else:
              props += '\nnetworkTimeout=120000\n'
          wrapper.write_text(props, encoding='utf-8')
          PY
          grep -F 'android:screenOrientation="sensorLandscape"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          grep -E "versionCode +${CUMA_VERSION_CODE}$" android/app/build.gradle
          grep -F "versionName \"${CUMA_VERSION_NAME}\"" android/app/build.gradle
          grep -F 'networkTimeout=120000' android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android toolchain
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build test APK and Play App Bundle
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x android/gradlew
          cd android
          success=0
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew --no-daemon assembleDebug bundleRelease --stacktrace; then
              success=1
              break
            fi
            sleep $((attempt * 8))
          done
          test "$success" -eq 1
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Optionally sign Play upload bundle
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/cuma-upload.jks
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore /tmp/cuma-upload.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              "$AAB" "$ANDROID_KEY_ALIAS"
            jarsigner -verify "$AAB"
            echo 'PLAY_UPLOAD_SIGNED=true' >> "$GITHUB_ENV"
          else
            echo 'PLAY_UPLOAD_SIGNED=false' >> "$GITHUB_ENV"
          fi

      - name: Generate SHA-256 and build manifest
        shell: bash
        run: |
          set -euxo pipefail
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          sha256sum "$AAB" > "$AAB.sha256"
          sha256sum "$APK" > "$APK.sha256"
          AAB_SHA="$(sha256sum "$AAB" | awk '{print $1}')"
          APK_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          MODEL_SOURCE="$(cat /tmp/cuma_character_source.txt)"
          MODEL_SHA="$(awk '{print $1}' /tmp/cuma_runtime.glb.sha256)"
          {
            echo 'CUMA WORLD Android Play Runtime'
            echo "commit=$GITHUB_SHA"
            echo "versionCode=$CUMA_VERSION_CODE"
            echo "versionName=$CUMA_VERSION_NAME"
            echo 'targetSdk=36'
            echo 'orientation=sensorLandscape'
            echo 'cleartextTraffic=false'
            echo "play_upload_signed=${PLAY_UPLOAD_SIGNED:-false}"
            echo "aab_sha256=$AAB_SHA"
            echo "apk_sha256=$APK_SHA"
            echo "cuma_model_source=$MODEL_SOURCE"
            echo "cuma_model_sha256=$MODEL_SHA"
            echo 'cuma_model_license=CC0/public-domain provenance file packaged'
            echo "audio_assets=${AUDIO_ASSETS:-not_packaged}"
            echo "bootstrap_js_bytes=${BOOTSTRAP_JS_BYTES:-unknown}"
            echo "largest_js_chunk_bytes=${LARGEST_JS_CHUNK_BYTES:-unknown}"
            echo "total_js_bytes=${TOTAL_JS_BYTES:-unknown}"
            echo "total_web_bytes=${TOTAL_WEB_BYTES:-unknown}"
          } > android/BUILD_INFO.txt
          cat android/BUILD_INFO.txt

      - name: Upload Android test and Play artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CUMA-WORLD-Android-Play-Build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/bundle/release/app-release.aab.sha256
            android/app/src/main/assets/public/assets/characters/CUMA_HIGH_LICENSE.txt
            android/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 7
