name: Inspect CUMA WORLD menu integration points

on:
  push:
    branches: [ chatgpt/cinematic-main-menu ]
    paths:
      - '.github/workflows/menu-source-inspect.yml'
      - 'ci/**'

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf game
          mkdir -p game
          unzip -q CUMA_WORLD_3D_GitHub_APK_Autobuild_2.1.1.zip -d game
          test -f game/project.godot
      - name: Print integration map
        shell: bash
        run: |
          set -euo pipefail
          echo '===== MAIN 45-110 ====='
          sed -n '45,110p' game/scripts/main.gd
          echo '===== MAIN 315-350 ====='
          sed -n '315,350p' game/scripts/main.gd
          echo '===== MAIN 715-790 ====='
          sed -n '715,790p' game/scripts/main.gd
          echo '===== MOBILE 1-80 ====='
          sed -n '1,80p' game/scripts/mobile_controls.gd
          echo '===== MOBILE 181-260 ====='
          sed -n '181,260p' game/scripts/mobile_controls.gd
          echo '===== MOBILE 419-468 ====='
          sed -n '419,468p' game/scripts/mobile_controls.gd
          echo '===== NETWORK MANAGER ====='
          sed -n '1,360p' game/scripts/network_manager.gd
          echo '===== GRAPHICS MANAGER ====='
          sed -n '1,320p' game/scripts/graphics_manager.gd
          echo '===== GAME STATE SAVE ====='
          sed -n '930,1065p' game/scripts/game_state.gd
          echo '===== PLAYER 42-185 ====='
          sed -n '42,185p' game/scripts/player_controller.gd
          echo '===== PLAYER CUSTOMIZATION ====='
          sed -n '388,416p' game/scripts/player_controller.gd
          echo '===== HOME AMBIENCE ====='
          sed -n '1,280p' game/scripts/world/home_ambience.gd
          echo '===== CUSTOMIZATION STATION ====='
          sed -n '1,260p' game/scripts/character/customization_station.gd
          echo '===== PROJECT ====='
          sed -n '1,120p' game/project.godot
