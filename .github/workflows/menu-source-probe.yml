name: Probe CUMA WORLD menu dependencies

on:
  push:
    branches: [ chatgpt/cinematic-main-menu ]
    paths:
      - '.github/workflows/menu-source-probe.yml'
      - 'ci/menu_probe_marker.txt'

permissions:
  contents: read

env:
  SOURCE_ZIP: 'CUMA_WORLD_3D_GitHub_APK_Autobuild_2.1.1.zip'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and patch source
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir Pillow
          rm -rf game
          mkdir -p game
          unzip -q "$SOURCE_ZIP" -d game
          python ci/apply_ci_patches.py
      - name: Print menu dependency map
        shell: bash
        run: |
          set -euo pipefail
          echo '===== AUDIO BUS / PLAYERS / VOLUME ====='
          grep -RniE 'AudioServer|AudioStreamPlayer|volume_db|bus *=|Master|SFX|Music|Ambience|mute|audio' game/scripts game/project.godot game/default_bus_layout.tres 2>/dev/null | head -n 500 || true
          echo '===== PAUSE / MENU / BACK INPUT ====='
          grep -RniE 'paused|ui_cancel|KEY_ESCAPE|KEY_BACK|go_back|pause|resume|notification' game/scripts game/project.godot 2>/dev/null | head -n 500 || true
          echo '===== GAMESTATE SETTINGS / QUALITY ====='
          grep -nE 'quality|sensitivity|volume|audio|settings|save|load' game/scripts/game_state.gd | head -n 500 || true
          echo '===== PROJECT INPUT MAP ====='
          sed -n '/\[input\]/,/^\[/p' game/project.godot | head -n 500 || true
      - name: Upload patched source map
        uses: actions/upload-artifact@v4
        with:
          name: CUMA-WORLD-menu-source-map
          path: |
            game/scripts/game_state.gd
            game/scripts/mobile_controls.gd
            game/scripts/player_controller.gd
            game/scripts/network_manager.gd
            game/project.godot
            game/default_bus_layout.tres
          if-no-files-found: warn
          retention-days: 2
