name: CUMA WORLD Cloudflare Control Plane

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-control-plane.yml'

permissions:
  contents: read

concurrency:
  group: cuma-world-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Wrangler dry-run build
        run: npm run build

      - name: Upload dry-run bundle
        uses: actions/upload-artifact@v4
        with:
          name: CUMA-WORLD-Cloudflare-Control-Plane-DryRun
          path: cloudflare/dist/
          if-no-files-found: error
          retention-days: 7
