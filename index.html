<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#090b0f" />
    <title>CUMA WORLD</title>
  </head>
  <body class="hud-compact">
    <canvas id="game"></canvas>

    <div id="boot" class="boot-screen">
      <div class="brand-kicker">CUMA WORLD</div>
      <h1>YOUR WORLD.<br />YOUR STORY.</h1>
      <button id="enter-world" class="primary">DÜNYAYA GİR</button>
      <div id="build-label" class="build-label">ANDROID PLAY RUNTIME · PRE-RELEASE</div>
    </div>

    <div id="hud" class="hud hidden">
      <section class="mission-card">
        <div class="eyebrow">FIELD OPS</div>
        <div id="mission-title" class="mission-title">SESSİZ TESLİMAT</div>
        <div id="objective" class="objective">Brifing hazırlanıyor</div>
        <div id="intel" class="intel">INTEL 0/4</div>
      </section>
      <button id="settings-open" class="hud-icon" aria-label="Ayarları aç">⚙</button>
      <div class="focus-reticle" aria-hidden="true"></div>
      <div id="awareness" class="awareness hidden" data-state="NORMAL">
        <span id="awareness-label">NORMAL</span>
        <i><b id="awareness-fill"></b></i>
      </div>
      <div id="observation-readout" class="observation-readout hidden">RECON LENS</div>
      <div id="interaction" class="interaction hidden"></div>
    </div>

    <div id="mobile-controls" class="mobile-controls hidden">
      <div id="joystick" class="joystick"><div id="joystick-knob" class="joystick-knob"></div></div>
      <div id="look-zone" class="look-zone"></div>
      <div class="actions">
        <button id="observe" class="action">GÖZLEM</button>
        <button id="interact" class="action action-primary">ETKİLEŞ</button>
      </div>
    </div>

    <aside id="settings-panel" class="settings-panel hidden" aria-label="Oyun ayarları">
      <div class="settings-header">
        <div>
          <div class="eyebrow">CUMA WORLD</div>
          <h2>AYARLAR</h2>
        </div>
        <button id="settings-close" class="settings-close" aria-label="Ayarları kapat">×</button>
      </div>

      <div class="settings-section-title">GRAFİK</div>
      <label class="setting-row">
        <span><strong>Kalite</strong><small>Performans ve görüntü bütçesi</small></span>
        <select id="graphics-tier">
          <option value="AUTO">AUTO</option>
          <option value="LOW">LOW</option>
          <option value="MEDIUM">MEDIUM</option>
          <option value="HIGH">HIGH</option>
          <option value="ULTRA">ULTRA</option>
        </select>
      </label>
      <label class="setting-row">
        <span><strong>Çözünürlük</strong><small>3D render ölçeği</small></span>
        <select id="graphics-resolution">
          <option value="AUTO">AUTO</option>
          <option value="0.7">%70</option>
          <option value="0.85">%85</option>
          <option value="1">%100</option>
        </select>
      </label>
      <label class="setting-row">
        <span><strong>FPS hedefi</strong><small>Pil ve akıcılık dengesi</small></span>
        <select id="graphics-fps">
          <option value="AUTO">AUTO</option>
          <option value="30">30 FPS</option>
          <option value="45">45 FPS</option>
          <option value="60">60 FPS</option>
        </select>
      </label>
      <label class="setting-row">
        <span><strong>Gölgeler</strong><small>Mobil GPU maliyeti yüksek olabilir</small></span>
        <select id="graphics-shadows">
          <option value="AUTO">AUTO</option>
          <option value="ON">AÇIK</option>
          <option value="OFF">KAPALI</option>
        </select>
      </label>

      <div class="settings-section-title">KONTROL</div>
      <label class="setting-row">
        <span><strong>Kamera hassasiyeti</strong><small>Sağ ekran sürükleme hızı</small></span>
        <select id="look-sensitivity">
          <option value="0.75">DÜŞÜK</option>
          <option value="1">NORMAL</option>
          <option value="1.25">YÜKSEK</option>
          <option value="1.5">ÇOK YÜKSEK</option>
        </select>
      </label>
      <label class="setting-row">
        <span><strong>HUD</strong><small>3D dünyaya daha fazla alan bırak</small></span>
        <select id="hud-mode">
          <option value="COMPACT">COMPACT</option>
          <option value="FULL">FULL</option>
        </select>
      </label>

      <div class="settings-section-title">SES</div>
      <label class="setting-row">
        <span><strong>Genel ses</strong><small>Ortam ve ayak sesleri</small></span>
        <select id="audio-volume">
          <option value="0">KAPALI</option>
          <option value="0.5">%50</option>
          <option value="0.75">%75</option>
          <option value="1">%100</option>
        </select>
      </label>

      <div class="settings-section-title">ERİŞİLEBİLİRLİK</div>
      <label class="setting-row toggle-row">
        <span><strong>Reduced Motion</strong><small>Kamera hareketlerini azaltır</small></span>
        <input id="reduced-motion" type="checkbox" />
      </label>

      <div class="settings-section-title">EKRAN</div>
      <div class="setting-row static-row">
        <span><strong>Android yönü</strong><small>Telefonu iki yatay yönde çevirebilirsin</small></span>
        <b>YATAY</b>
      </div>

      <div id="graphics-status" class="graphics-status">Profil hazırlanıyor…</div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
